name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  deployments: write

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies reliably
        run: npm ci

      - name: Build Vite application
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: diblo-39440
          VITE_FIREBASE_AUTH_DOMAIN: diblo-39440.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: diblo-39440.firebasestorage.app
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY || 'AIzaSyCb0Fq3FsC-C1mTfM7pugmioQO7fL6Z_MM' }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || 'AIzaSyCb0Fq3FsC-C1mTfM7pugmioQO7fL6Z_MM' }}

      - name: Build Cloud Functions
        run: |
          if [ -d "functions" ]; then
            npm --prefix functions ci
            npm --prefix functions run build
          fi

      - name: Deploy Cloud Functions to Firebase
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}"
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx --yes firebase-tools deploy --only functions --project diblo-39440 --non-interactive || echo "Functions deployment warning, continuing with hosting..."
          rm -f /tmp/sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build directory 'dist' was not found!"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "::error::'dist/index.html' is missing!"
            exit 1
          fi
          echo "Build verified successfully. Contents of dist/:"
          ls -la dist/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: diblo-39440
