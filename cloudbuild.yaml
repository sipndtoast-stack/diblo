steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/diblo-app:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/diblo-app:latest'
      - '.'

  # 2. Push Container Image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/diblo-app:$COMMIT_SHA'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'diblo-platform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/diblo-app:$COMMIT_SHA'
      - '--region'
      - 'asia-south1' # Mumbai Region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/diblo-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/diblo-app:latest'

timeout: '900s'
